<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Roastery</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<style>
  @font-face {
    font-family: 'TradeGothic';
    src: local('Trade Gothic LT Std'), local('TradeGothicLTStd'), local('Trade Gothic LT Std Roman'),
         url('https://cdn.shopify.com/s/files/1/0084/0826/8890/files/TradeGothicLTStd.woff2?v=1780693074') format('woff2');
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'TradeGothicExtBd';
    src: local('TradeGothicLTStd-BoldExt'), local('Trade Gothic LT Std Bold Extended'),
         url('https://cdn.shopify.com/s/files/1/0084/0826/8890/files/TradeGothicLTStd-BoldExt.woff2?v=1780693074') format('woff2');
    font-weight: 700; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'TradeGothicExt';
    src: local('TradeGothicLTStd-Extended'), local('Trade Gothic LT Std Extended'),
         url('https://cdn.shopify.com/s/files/1/0084/0826/8890/files/TradeGothicLTStd-Extended.woff2?v=1780693074') format('woff2');
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'TradeGothicBd2';
    src: local('TradeGothicLTStd-Bd2'), local('Trade Gothic LT Std Bold No 2'),
         url('https://cdn.shopify.com/s/files/1/0084/0826/8890/files/TradeGothicLTStd-Bd2.woff2?v=1780693074') format('woff2');
    font-weight: 700; font-style: normal; font-display: swap;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #111111;
    color: #e8e2d9;
  }

  body {
    font-family: 'TradeGothic', 'Trade Gothic LT Std', Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8vh 20px;
  }

  .sheet {
    width: 100%;
    max-width: 560px;
  }

  .sheet-head {
    text-align: center;
    border-bottom: 1px solid #333;
    padding-bottom: 16px;
    margin-bottom: 28px;
  }

  .sh-title {
    font-family: 'TradeGothicExtBd', Arial, sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #888;
  }

  .menu {
    list-style: none;
  }

  .item {
    display: block;
    text-decoration: none;
    color: inherit;
    padding: 20px 4px;
    border-bottom: 1px solid #1a1a1a;
  }
  .item:last-child { border-bottom: none; }

  .item:focus-visible {
    outline: 1px solid #555;
    outline-offset: 6px;
  }

  .row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
  }

  .name {
    font-family: 'TradeGothicExtBd', Arial, sans-serif;
    font-weight: 700;
    font-size: clamp(18px, 3.6vw, 22px);
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: #e8e2d9;
    transition: color 0.15s ease;
  }

  .item:hover .name,
  .item:focus-visible .name {
    color: #ffffff;
  }

  .arrow {
    font-family: 'TradeGothicExtBd', Arial, sans-serif;
    font-size: 14px;
    color: #555;
    flex-shrink: 0;
    transition: color 0.15s ease, transform 0.2s ease;
  }

  .item:hover .arrow,
  .item:focus-visible .arrow {
    color: #ffffff;
    transform: translateX(4px);
  }

  .tagline {
    margin-top: 5px;
    font-family: 'TradeGothic', Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 0.02em;
    color: #777;
  }

  @media (prefers-reduced-motion: reduce) {
    .name, .arrow { transition: none; }
  }
</style>
</head>
<body>

  <div class="sheet">

    <div class="sheet-head">
      <p class="sh-title">The Roastery</p>
    </div>

    <ul class="menu">

      <li>
        <a class="item" href="https://templecoffee.github.io/coffeefilter/" target="_blank" rel="noopener">
          <div class="row">
            <span class="name">coffee.filter</span>
            <span class="arrow">&#8594;</span>
          </div>
          <p class="tagline">Optimize photos for shopify/web use.</p>
        </a>
      </li>

      <li>
        <a class="item" href="https://templecoffee.github.io/coffeerollout/" target="_blank" rel="noopener">
          <div class="row">
            <span class="name">ACRO</span>
            <span class="arrow">&#8594;</span>
          </div>
          <p class="tagline">Automated Coffee Roll Out</p>
        </a>
      </li>

      <li>
        <a class="item" href="https://tcriretailtags.netlify.app/" target="_blank" rel="noopener">
          <div class="row">
            <span class="name">re.tag</span>
            <span class="arrow">&#8594;</span>
          </div>
          <p class="tagline">RE:Retail tag maker</p>
        </a>
      </li>

      <li>
        <a class="item" href="https://tcripadtags.netlify.app/" target="_blank" rel="noopener">
          <div class="row">
            <span class="name">fresh.baked</span>
            <span class="arrow">&#8594;</span>
          </div>
          <p class="tagline">Bake up some oastry &amp; dessert tags</p>
        </a>
      </li>

      <li>
        <a class="item" href="https://templecoffee.github.io/portafilter/" target="_blank" rel="noopener">
          <div class="row">
            <span class="name">portafilter</span>
            <span class="arrow">&#8594;</span>
          </div>
          <p class="tagline">Infosheet to CSV for InDesign Data Merge</p>
        </a>
      </li>

    </ul>

  </div>

</body>
</html>
